# 신청 웹(lib/main_public.dart)을 빌드해서 GitHub Pages 에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로.
# 주소: https://yjchae.github.io/room-assignment/?g=<집회id>
name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter test # 테스트가 깨지면 배포하지 않는다
      - run: flutter build web --release -t lib/main_public.dart --base-href /room-assignment/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
