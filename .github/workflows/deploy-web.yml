# 신청 웹(lib/main_public.dart)과 운영자 웹(lib/main.dart)을 빌드해서 GitHub Pages 에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로.
# 주소: 신청  https://yjchae.github.io/room-assignment/?g=<집회id>
#       운영자 https://yjchae.github.io/room-assignment/admin/  (운영자 로그인해야 데이터가 보인다 — DB 권한이 막는다)
name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter test # 테스트가 깨지면 배포하지 않는다
      # 운영자 웹을 먼저 따로 빌드해 두고, 신청 웹 결과 안의 admin/ 으로 옮긴다.
      - run: flutter build web --release -t lib/main.dart --base-href /room-assignment/admin/ -o "$PWD/build/admin"
      - run: sed -i 's/집회 신청/집회관리/g' build/admin/index.html build/admin/manifest.json
      - run: flutter build web --release -t lib/main_public.dart --base-href /room-assignment/
      - run: mv build/admin build/web/admin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
